<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kit Boas-Vindas — ROI do Welcome Kit | Praia Digital</title><meta name="description" content="Quanto investir no kit de boas-vindas para transformar avaliações 5 estrelas em rebooking e receita."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#fdeef4,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #b03a6b22}h1{color:#9c2f5c;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #f2d5e1;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#b03a6b;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#fdeaF2;border-radius:12px;padding:1rem;background:#fdeaf2}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#b03a6b;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/fideliza">Fideliza</a> · <a href="https://praia.digital/checkin-express">Check-in Express</a> · <a href="https://praia.digital/reputacao">Reputação</a></nav><div class="card"><h1>🎁 Kit Boas-Vindas</h1><p>R$ 40 de atenção valem mais que R$ 400 de anúncio. Prove com números.</p><label>Ticket do kit por estadia</label><select id="k"><option value="25">Básico (água, café, biscoitos) — R$ 25</option><option value="45" selected>Caprichado (+ frutas, mapa local) — R$ 45</option><option value="80">Premium (+ vinho, produtos artesanais) — R$ 80</option></select><label>Estadias por mês</label><input id="e" type="number" value="8"><label>Diária média (R$)</label><input id="d" type="number" value="450"><label>Estadias extras/ano por rebooking e indicação</label><input id="r" type="number" value="6"><button onclick="calc()">Calcular retorno</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const k=g('k'),e=g('e'),d=g('d'),r=g('r');const custoAno=k*e*12,receitaExtra=r*d*4*1.0,roi=(receitaExtra-custoAno);document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>💸 Custo anual do kit: <b>R$ ${custoAno.toFixed(0)}</b></p><p>⭐ Kits elevam notas de avaliação em ~0,2-0,3 pontos — o que aumenta conversão e permite subir a diária.</p><p>📈 Receita estimada de rebooking/indicação (R$ ${d} × 4 noites × ${r} estadias): <b>R$ ${receitaExtra.toFixed(0)}/ano</b></p><p>🏆 Saldo: <b style="color:${roi>=0?'#2e8b57':'#c0392b'}">R$ ${roi.toFixed(0)}/ano</b> — ROI de ${(receitaExtra/custoAno).toFixed(1)}x</p><p>💡 Feche o ciclo de fidelidade no <a href="https://praia.digital/fideliza">Fideliza</a> e monitore sua nota no <a href="https://praia.digital/reputacao">Reputação</a>.</p>`}</script></body></html>
